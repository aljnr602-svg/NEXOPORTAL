<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 380"
  role="img"
  aria-labelledby="title"
>
  <title id="title">
    Una página web une estructura HTML, presentación CSS y comportamiento JavaScript
  </title>
  <rect width="900" height="380" rx="25" fill="#1d2927" />
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="450" y="65" fill="#fff" font-size="26">Tres piezas. Una experiencia.</text>
    <rect x="55" y="110" width="235" height="200" rx="22" fill="#d6f66b" />
    <rect x="332" y="110" width="235" height="200" rx="22" fill="#d9ccff" />
    <rect x="610" y="110" width="235" height="200" rx="22" fill="#b8e6db" />
    <g fill="#1d2927">
      <text x="172" y="205" font-size="38">HTML</text>
      <text x="450" y="205" font-size="38">CSS</text>
      <text x="727" y="205" font-size="38">JavaScript</text>
      <text x="172" y="255" font-size="20">Estructura</text>
      <text x="450" y="255" font-size="20">Presentación</text>
      <text x="727" y="255" font-size="20">Interacción</text>
    </g>
  </g>
</svg>
