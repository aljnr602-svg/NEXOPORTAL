<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 340"
  role="img"
  aria-labelledby="title"
>
  <title id="title">Organiza tu tiempo de estudio</title>
  <rect width="900" height="340" rx="25" fill="#1d2927" />
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="450" y="60" fill="#ffffff" font-size="24">
      Organiza tu tiempo de estudio
    </text>
    <rect x="45" y="100" width="250" height="190" rx="20" fill="#d6f66b" />
    <text x="170" y="178" fill="#1d2927" font-size="23" font-weight="bold">Plan</text>
    <text x="170" y="228" fill="#1d2927" font-size="17">Priorizar</text>
    <rect x="325" y="100" width="250" height="190" rx="20" fill="#d9ccff" />
    <text x="450" y="178" fill="#1d2927" font-size="23" font-weight="bold">Foco</text>
    <text x="450" y="228" fill="#1d2927" font-size="17">Una tarea</text>
    <rect x="605" y="100" width="250" height="190" rx="20" fill="#b8e6db" />
    <text x="730" y="178" fill="#1d2927" font-size="23" font-weight="bold">Revisión</text>
    <text x="730" y="228" fill="#1d2927" font-size="17">Ajustar</text>
  </g>
</svg>
