<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 340"
  role="img"
  aria-labelledby="title"
>
  <title id="title">Lógica para crear</title>
  <rect width="900" height="340" rx="25" fill="#1d2927" />
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="450" y="60" fill="#ffffff" font-size="24">Lógica para crear</text>
    <rect x="45" y="100" width="250" height="190" rx="20" fill="#d6f66b" />
    <text x="170" y="178" fill="#1d2927" font-size="23" font-weight="bold">Entrada</text>
    <text x="170" y="228" fill="#1d2927" font-size="17">Datos</text>
    <rect x="325" y="100" width="250" height="190" rx="20" fill="#d9ccff" />
    <text x="450" y="178" fill="#1d2927" font-size="23" font-weight="bold">Proceso</text>
    <text x="450" y="228" fill="#1d2927" font-size="17">Instrucciones</text>
    <rect x="605" y="100" width="250" height="190" rx="20" fill="#b8e6db" />
    <text x="730" y="178" fill="#1d2927" font-size="23" font-weight="bold">Salida</text>
    <text x="730" y="228" fill="#1d2927" font-size="17">Resultado</text>
  </g>
</svg>
